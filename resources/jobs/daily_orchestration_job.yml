resources:
  jobs:
    Phase_3_Pipeline:
      name: "Phase_3_Pipeline "
      schedule:
        quartz_cron_expression: 51 0 5 * * ?
        timezone_id: America/Chicago
        pause_status: PAUSED
      tasks:
        - task_key: Beestats_Pipeline
          pipeline_task:
            pipeline_id: 8d5cb09f-f282-4099-a591-e783f3fc82fa
          max_retries: 2
          min_retry_interval_millis: 900000
          timeout_seconds: 3600
          health:
            rules:
              - metric: RUN_DURATION_SECONDS
                op: GREATER_THAN
                value: 1800
          email_notifications:
            on_success:
              - a01783104@tec.mx
            on_failure:
              - a01783104@tec.mx
            on_duration_warning_threshold_exceeded:
              - a01783104@tec.mx
        - task_key: Beestats_Dashboard
          depends_on:
            - task_key: Beestats_Pipeline
          dashboard_task:
            subscription:
              subscribers:
                - user_name: a01783104@tec.mx
              attachment:
                page_attachment: {}
            warehouse_id: d6c7c9d5921496d6
            dashboard_id: 01f1d3a7d0c01e2a818b564498add967
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
